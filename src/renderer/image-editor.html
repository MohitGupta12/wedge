<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'">
  <title>Image editor · Wedge</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="editor.css">
  <style>
    #view { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
    #text-input {
      position: absolute;
      min-width: 120px;
      border: 2px dashed var(--accent);
      background: rgba(0, 0, 0, 0.15);
      color: inherit;
      outline: none;
      padding: 2px 6px;
      font-family: var(--font);
      font-weight: 650;
      border-radius: 6px;
      z-index: 4;
    }
    .loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--text-3); }
  </style>
</head>
<body>
  <header class="ed-top">
    <div class="ed-title"><span class="kind" id="kind-icon"></span><b id="name"></b><span id="dims"></span></div>
    <div class="ed-spacer"></div>
    <div class="ed-actions">
      <button class="icon-btn" id="undo" title="Undo (Ctrl+Z)" aria-label="Undo"></button>
      <button class="icon-btn" id="redo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"></button>
      <span class="sep"></span>
      <select class="mini" id="format" aria-label="Save as">
        <option value="same">Same format</option>
        <option value="png">PNG</option>
        <option value="jpg">JPG</option>
        <option value="webp">WebP</option>
      </select>
      <button class="btn primary" id="save" title="Save a copy (Ctrl+S)"></button>
    </div>
  </header>
  <div class="ed-body">
    <nav class="ed-tools" id="tools" aria-label="Tools"></nav>
    <main class="ed-stage" id="stage">
      <canvas id="view"></canvas>
      <input id="text-input" hidden spellcheck="false" aria-label="Text">
      <div class="loading" id="loading">Loading…</div>
      <div class="busy" id="busy" hidden><div class="busy-card"><b></b><div class="bar"><i></i></div></div></div>
    </main>
    <aside class="ed-panel" id="panel"></aside>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script src="icons.js"></script>
  <script src="editor-common.js"></script>
  <script src="image-editor.js"></script>
</body>
</html>
