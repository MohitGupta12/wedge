<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>Wedge Shelf</title>
  <link rel="stylesheet" href="common.css">
  <style>
    html, body { height: 100%; background: transparent; overflow: hidden; }
    .shelf {
      position: absolute; inset: 6px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      box-shadow: 0 8px 28px rgba(0,0,0,.22);
      display: flex; flex-direction: column; overflow: hidden;
      backdrop-filter: blur(20px);
    }
    .shelf.over { outline: 2px solid var(--accent); outline-offset: -2px; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 6px 12px; -webkit-app-region: drag; }
    header b { font-size: 12px; color: var(--text-2); }
    header .btns { display: flex; gap: 2px; -webkit-app-region: no-drag; }
    header button { border: 0; background: transparent; color: var(--text-2); border-radius: 6px; padding: 2px 7px; cursor: pointer; font-size: 12px; }
    header button:hover { background: var(--accent-soft); color: var(--text); }
    ul { list-style: none; margin: 0; padding: 4px 8px 8px; overflow: auto; flex: 1; display: grid; gap: 4px; align-content: start; }
    li { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--border); cursor: grab; }
    li:hover { border-color: var(--accent); }
    li img { width: 26px; height: 26px; flex: none; }
    li span { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    li button { border: 0; background: transparent; color: var(--text-3); cursor: pointer; font-size: 14px; padding: 0 2px; }
    li button:hover { color: var(--err); }
    .all { margin: 0 8px 8px; }
    .empty { text-align: center; color: var(--text-3); font-size: 12px; padding: 30px 12px; }
  </style>
</head>
<body>
  <div class="shelf" id="shelf">
    <header><b>Shelf</b><div class="btns"><button id="clear" title="Clear and close">Clear</button><button id="close" title="Hide">✕</button></div></header>
    <ul id="items"></ul>
    <div class="empty" id="empty">Drop files here to keep them handy, then drag them out into any app.</div>
    <button class="btn small all" id="drag-all" hidden>Drag all</button>
  </div>
  <script src="shelf.js"></script>
</body>
</html>
