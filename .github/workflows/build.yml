name: Build installers

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Attach the macOS and Linux builds to this release as beta downloads (e.g. v0.1.0). Leave empty to skip.'
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: write # only used to attach beta builds to a release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Linux libraries for the global input hook
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxtst6 libxkbcommon-x11-0 xvfb
      - run: npm ci
      - run: npm run icons
      - name: Self-test
        if: runner.os != 'Linux'
        run: npx electron . --self-test
      - name: Self-test (headless)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx electron . --self-test --no-sandbox
      - name: Package
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Attach to the release as beta
        if: inputs.release != '' && runner.os != 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p upload
          if [ "$RUNNER_OS" = "macOS" ]; then
            cp dist/*.dmg "upload/Wedge-$VERSION-macOS-AppleSilicon-beta.dmg"
          else
            cp dist/*.AppImage "upload/Wedge-$VERSION-linux-x86_64-beta.AppImage"
            cp dist/*.deb "upload/wedge_${VERSION}_amd64-beta.deb"
          fi
          gh release upload "$TAG" upload/* --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: wedge-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: ignore
